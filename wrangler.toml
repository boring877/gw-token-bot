# Cloudflare Worker config for the GachaWiki $GW Discord presence bot.
# This is a separate Workers + Durable Object project, decoupled from the
# gacha-wiki Cloudflare Pages project (which has no DO bindings — no conflict).
name = "gacha-wiki-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Single Durable Object that owns the persistent Discord gateway WebSocket.
# Uses the WebSocket Hibernation API so it burns ~zero compute between
# heartbeats (~41s) and stat updates (~60s) — fits the Workers free tier.
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayDO"

# SQLite-backed DO is the only storage backend allowed on the Workers free tier.
# Each migration tag is one-time; add new tags if the DO class list ever changes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayDO"]

# 1-minute watchdog cron: if the gateway WebSocket ever drops and the DO
# has hibernated with no active connection, this wakes it to re-bootstrap.
[triggers]
crons = ["* * * * *"]

# Static assets — the bot's custom embed GIFs (buy/sell/burn), generated by
# tools/make_gifs.py into public/gifs/. Asset paths are served directly by the
# edge; every other request still hits the Worker (and is routed to the DO).
[assets]
directory = "./public"

# Non-secret vars. BUYS_CHANNEL_ID targets the channel where buy/sell/burn feed
# messages go. Leave empty to disable the feed (presence still works).
# Set it in .dev.vars for local dev (also gitignored).
# GUILD_ID + OG_ROLE_ID drive holder verification (/verify -> OG Holder role);
# the role was created via Discord REST (name "OG Holder", amber).
[vars]
BUYS_CHANNEL_ID = "1536699696817381426"
GUILD_ID = "1534112093752659968"
OG_ROLE_ID = "1538113608427507742"
MEMBER_ROLE_ID = "1538409320155324457"
# Wiki Member role (grants GachaWiki access; checked by /code). Created via REST.
WIKI_ROLE_ID = "1564572966421790850"
# #og-holder-verify: auto multilingual redirect for wiki-access seekers.
OG_VERIFY_CHANNEL_ID = "1538371900005285969"
# #wiki-requests: accounts >= 2 years get Wiki Member automatically.
WIKI_REQUESTS_CHANNEL_ID = "1564575899246923817"
# #wiki-updates (Info category) — target of the GitHub push webhook.
WIKI_UPDATES_CHANNEL_ID = "1545851895074263080"
# X crosspost: #x-feed was DELETED 2026-09-05 (no free X read path, user won't
# pay for the API). src/xpost.ts stays dormant — no X_* secrets are set. If X
# posting is ever revived, create a channel and re-add X_FEED_CHANNEL_ID here.

# Shared with the gate worker (gacha-wiki repo): invite codes + member records.
[[kv_namespaces]]
binding = "MEMBERS"
id = "6614fbfb7de34e97bf0603d3acc347ba"
